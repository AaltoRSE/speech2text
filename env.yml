name: speech2text
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - git
  - ffmpeg
  - libsndfile
  - numpy
  - python=3.10
  - pydub
  - cudnn>=9  # torch 2.8+ requires cudnn 9; verify whisperx still works (see issue #967)
  - nvidia::cuda-libraries-dev
  #- pytorch::pytorch>=2.8
  #- pytorch::torchvision  # conda resolves compatible version
  #- pytorch::torchaudio
  #- pytorch::pytorch-cuda=12.6  # 12.6 is available on Triton
  - pip
  - pip:
    - torch>=2.8
    - numba
    - pyannote.audio>=4.0  # 4.x uses token= instead of use_auth_token
    # Requires ctranslate <4.5.0 and faster-whisper>=1.1.1. Link to the issue: https://github.com/m-bain/whisperX/issues/901
    - ctranslate2==4.4.0
    - faster-whisper==1.1.1
    # WhisperX requires a specific commit of the repository to work properly with ctranslate2==4.4.0 and faster-whisper==1.1.1.
    - whisperx @ git+https://github.com/m-bain/whisperX.git@cd59f21


