name: speech2text
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - git
  - ffmpeg
  - libsndfile
  - numpy
  - python=3.10
  - pydub
  - cudnn>=8,<9 # This is equivalent to libcudnn8 which is needed for whisperx. Link to the issue: https://github.com/m-bain/whisperX/issues/967
  - pytorch-lightning=2.2.5
  - nvidia::cuda-libraries-dev
  - pytorch::pytorch=2.5.1
  - pytorch::torchvision=0.20.1
  - pytorch::torchaudio=2.5.1
  - pytorch::pytorch-cuda=12.1
  - pip
  - pip:
    - numba==0.62.0
    - pyannote.audio==3.4.0
    # Requires ctranslate <4.5.0 and faster-whisper>=1.1.1. Link to the issue: https://github.com/m-bain/whisperX/issues/901
    - ctranslate2==4.4.0
    - faster-whisper==1.1.1
    # WhisperX requires a specific commit of the repository to work properly with ctranslate2==4.4.0 and faster-whisper==1.1.1.
    - whisperx @ git+https://github.com/m-bain/whisperX.git@cd59f21
