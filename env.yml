name: speech2text
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - git
  - ffmpeg
  - libsndfile
  - numpy
  - python=3.10
  - pydub
  - cudnn>=8,<9 # This is equivalent to libcudnn8 which is needed for whisperx. Link to the issue: https://github.com/m-bain/whisperX/issues/967
  - pytorch-lightning=2.2.5
  - nvidia::cuda-libraries-dev
  - pytorch::pytorch=2.5.1
  - pytorch::torchvision=0.20.1
  - pytorch::torchaudio=2.5.1
  - pytorch::pytorch-cuda=12.6
  - pip
  - pip:
    - numba
    - pyannote.audio
    - ctranslate2
    - faster-whisper
    - whisperx @ git+https://github.com/m-bain/whisperX.git
